<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ad Killer</title>
<link rel='icon' href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚫</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#e7e5e0;color:#1f2430;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:34px 18px;user-select:none}
.wordmark{font-size:13px;font-weight:700;letter-spacing:.14em;color:#6b6f76}
.sub{color:#8a8f98;font-size:12px;margin-top:6px}
.window{width:min(680px,96vw);margin-top:20px;background:#fff;border:1px solid #d9d7d2;border-radius:10px;overflow:hidden;box-shadow:0 18px 44px rgba(31,36,48,.12)}
.titlebar{display:flex;align-items:center;gap:6px;background:#f5f4f1;border-bottom:1px solid #e0ded9;padding:9px 12px}
.dot{width:10px;height:10px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.titlebar .tb-title{margin:0 auto;font-size:12px;color:#7a7e85;transform:translateX(-21px)}
#field{position:relative;height:400px;background:#fff;overflow:hidden;cursor:crosshair}
.ad{position:absolute;background:#fff;color:#3a4152;border:1px solid #dcd9d3;border-radius:8px;padding:9px 11px 8px;font-size:11px;line-height:1.45;box-shadow:0 6px 18px rgba(31,36,48,.14);cursor:pointer;transition:transform .1s}
.ad .x{position:absolute;top:4px;right:4px;width:16px;height:16px;border-radius:50%;background:#f0efec;color:#7a7e85;font-size:10px;font-weight:700;line-height:16px;text-align:center;cursor:pointer}
.ad .x:hover{background:#e05252;color:#fff}
.ad b{display:block;font-size:12px;font-weight:600;color:#1f2430;padding-right:16px}
.statusbar{display:flex;justify-content:center;background:#f5f4f1;border-top:1px solid #e0ded9;padding:8px 12px;font-size:11px;color:#7a7e85;letter-spacing:.02em}
.statusbar b{color:#1f2430;font-weight:600;padding:0 4px}
#msg{margin-top:12px;font-size:12px;color:#8a8f98;min-height:18px;font-style:italic}
</style>
</head>
<body>
<div class="wordmark">AD KILLER</div>
<div class="sub">close every popup &middot; click the X, not the ad</div>
<div class="window">
  <div class="titlebar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="tb-title">the open web, cleansed</span></div>
  <div id="field"></div>
  <div class="statusbar" id="hud">ADS CLOSED <b id="kills">0</b> &nbsp;&middot;&nbsp; ACCIDENTAL CLICKS <b id="oops">0</b> &nbsp;&middot;&nbsp; SANITY <b id="sanity">100</b>%</div>
</div>
<div id="msg">hitting the ad body opens it. only the X closes it.</div>
<script>
const field=$('field');
function $(id){return document.getElementById(id);}
const ADS=[
["DOCTORS HATE HIM","Local man discovers one weird trick"],
["HOT SINGLES","In your area. Somehow. Always."],
["CONGRATULATIONS!","You are the 1,000,000th visitor"],
["YOUR PC IS SLOW","Download SpeedMax Pro Ultra"],
["LOSE 30 LBS","With this ancient tallow secret"],
["FREE IPHONE","Just answer 400 surveys"],
["CRYPTO MOON","Invest now. Trust us."],
["EXTEND WARRANTY","Your car's warranty is crying"]
];
let kills=0,oops=0,sanity=100;
function spawn(){
  if(sanity<=0)return;
  const a=ADS[Math.floor(Math.random()*ADS.length)];
  const el=document.createElement('div');el.className='ad';
  el.style.left=(10+Math.random()*(field.clientWidth-190))+'px';
  el.style.top=(10+Math.random()*(field.clientHeight-90))+'px';
  el.style.width=(140+Math.random()*60)+'px';
  el.innerHTML='<span class="x">X</span><b>'+a[0]+'</b>'+a[1];
  el.querySelector('.x').onclick=e=>{
    e.stopPropagation();
    kills++;$('kills').textContent=kills;
    el.style.transform='scale(0)';setTimeout(()=>el.remove(),120);
    sanity=Math.min(100,sanity+2);$('sanity').textContent=sanity;
    if(kills%10===0)$('msg').textContent=kills+' ads closed. the internet briefly heals.';
  };
  el.onclick=e=>{
    e.stopPropagation();
    oops++;$('oops').textContent=oops;
    sanity=Math.max(0,sanity-15);$('sanity').textContent=sanity;
    $('msg').textContent='you clicked the ad. it opens 3 more tabs in your soul.';
    spawn();spawn();
    if(sanity<=0){field.innerHTML='';$('msg').textContent='SANITY DEPLETED. The ads win. Score: '+kills+' closed, '+oops+' clicked. Refresh to fight again.';clearInterval(iv);clearInterval(dr);}
  };
  field.appendChild(el);
}
const iv=setInterval(spawn,900);
const dr=setInterval(()=>{sanity=Math.max(0,sanity-1);$('sanity').textContent=sanity;
  if(sanity<=0){field.innerHTML='';$('msg').textContent='SANITY DEPLETED. Score: '+kills+' closed, '+oops+' clicked. Refresh to fight again.';clearInterval(iv);clearInterval(dr);}
},1000);
spawn();spawn();spawn();
</script>
</body>
</html>
